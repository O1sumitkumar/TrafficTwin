  - [39.1405, 21.7431]
  - [39.1264, 21.7281]
  - [39.1201, 21.7141]
  - [39.1000, 21.7018]
  - [39.1000, 21.7000]
  - [39.0800, 21.7000]
  - [39.0800, 21.7160]
  - [39.0868, 21.7160]
out_dir: data/windows/obhur_creek
