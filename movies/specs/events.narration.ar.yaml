# Arabic narration for events (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: events
lines:
  - shot: rain
    at: 0.6
    text: "أمطار غزيرة: يخفف السائقون سرعتهم ويتركون مسافات أطول. ويرتفع متوسط التأخير 23.3 في المئة."
    say: "أَمْطَارٌ غَزِيرَةٌ: يُخَفِّفُ السَّائِقُونَ سُرْعَتَهُمْ وَيَتْرُكُونَ مَسَافَاتٍ أَطْوَلْ. وَيَرْتَفِعُ مُتَوَسِّطُ التَّأْخِيرِ ثَلَاثَةً وَعِشْرِينَ فَاصِلَةَ ثَلَاثَةٍ فِي المِئَةْ."
  - shot: flood
    at: 0.6
    text: "عاصفة تُغرق مواقع الأنفاق المراجَعة، وتُغلق 13 قطعة طريق. ويتضاعف متوسط التأخير وأكثر، بزيادة 123.8 في المئة."
    say: "عَاصِفَةٌ تُغْرِقُ مَوَاقِعَ الأَنْفَاقِ المُرَاجَعَةِ، وَتُغْلَقُ ثَلَاثَ عَشْرَةَ قِطْعَةَ طَرِيقْ. وَيَتَضَاعَفُ مُتَوَسِّطُ التَّأْخِيرِ وَأَكْثَرَ، بِزِيَادَةِ مِئَةٍ وَثَلَاثَةٍ وَعِشْرِينَ فَاصِلَةَ ثَمَانِيَةٍ فِي المِئَةْ."
  - shot: motorcade
    at: 0.6
    text: "موكب من ست مركبات على طريق التحلية، والتقاطعات تُوقَف أمامه."
    say: "مَوْكِبٌ مِنْ سِتِّ مَرْكَبَاتٍ عَلَى طَرِيقِ التَّحْلِيَةِ، وَالتَّقَاطُعَاتُ تُوقَفُ أَمَامَهْ."
  - shot: motorcade
    text: "يستغرق 85 ثانية، مقابل 66.5 في الانسياب الحر. سيناريوهات افتراضية، طلب اصطناعي، غير معاير."
    say: "يَسْتَغْرِقُ خَمْسًا وَثَمَانِينَ ثَانِيَةً، مُقَابِلَ سِتٍّ وَسِتِّينَ فَاصِلَةِ خَمْسَةٍ فِي الانْسِيَابِ الحُرّْ. سِينَارْيُوهَاتٌ افْتِرَاضِيَّةٌ، طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
