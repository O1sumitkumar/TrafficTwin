# Arabic narration for policy-lab (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: policy-lab
lines:
  - shot: remote-work
    at: 0.6
    text: "مختبر السياسات، على شبكة المدينة الثانية: الطرق الزرقاء تصبح أسرع، والحمراء أبطأ."
    say: "مُخْتَبَرُ السِّيَاسَاتِ، عَلَى شَبَكَةِ المَدِينَةِ الثَّانِيَةِ: الطُّرُقُ الزَّرْقَاءُ تُصْبِحُ أَسْرَعَ، وَالحَمْرَاءُ أَبْطَأْ."
  - shot: remote-work
    text: "مع العمل عن بعد بنسبة 30 في المئة، تنخفض ساعات المركبات 8.7 في المئة، وكانت 7.7 في المئة على الشبكة الأولى."
    say: "مَعَ العَمَلِ عَنْ بُعْدٍ بِنِسْبَةِ ثَلَاثِينَ فِي المِئَةِ، تَنْخَفِضُ سَاعَاتُ المَرْكَبَاتِ ثَمَانِيَةً فَاصِلَةَ سَبْعَةٍ فِي المِئَةِ، وَكَانَتْ سَبْعَةً فَاصِلَةَ سَبْعَةٍ عَلَى الشَّبَكَةِ الأُولَى."
  - shot: staggered-schools
    at: 0.6
    text: "توزيع بدء المدارس على 60 دقيقة يخفض تأخير ذروة الصباح 1.8 في المئة فقط، وكان 9.1 في المئة على الشبكة الأولى."
    say: "تَوْزِيعُ بَدْءِ المَدَارِسِ عَلَى سِتِّينَ دَقِيقَةً يُخَفِّضُ تَأْخِيرَ ذُرْوَةِ الصَّبَاحِ وَاحِدًا فَاصِلَةَ ثَمَانِيَةٍ فِي المِئَةِ فَقَطْ، وَكَانَ تِسْعَةً فَاصِلَةَ وَاحِدٍ عَلَى الشَّبَكَةِ الأُولَى."
  - shot: cordon
    at: 0.6
    text: "رسم دخول للمركز قدره 10 ريالات يدفع الحركة إلى الطرق المحيطة: ترتفع ساعات المركبات 17.2 في المئة، وكانت 12.4 في المئة على الشبكة الأولى."
    say: "رَسْمُ دُخُولٍ لِلْمَرْكَزِ قَدْرُهُ عَشَرَةُ رِيَالَاتٍ يَدْفَعُ الحَرَكَةَ إِلَى الطُّرُقِ المُحِيطَةِ: تَرْتَفِعُ سَاعَاتُ المَرْكَبَاتِ سَبْعَةَ عَشَرَ فَاصِلَةَ اثْنَيْنِ فِي المِئَةِ، وَكَانَتْ اثْنَيْ عَشَرَ فَاصِلَةَ أَرْبَعَةٍ عَلَى الشَّبَكَةِ الأُولَى."
  - shot: cordon
    text: "ما زال الاختناق والنقل الآلي قائمين، فالنتائج استرشادية. طلب اصطناعي، غير معاير."
    say: "مَا زَالَ الاخْتِنَاقُ وَالنَّقْلُ الآلِيُّ قَائِمَيْنِ، فَالنَّتَائِجُ اسْتِرْشَادِيَّةْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
